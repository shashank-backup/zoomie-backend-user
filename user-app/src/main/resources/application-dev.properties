spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

################# SERVER #################
server.port=8082
#server.servlet.context-path=/teachr
server.compression.enabled=true
server.tomcat.basedir=./
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.prefix=access
server.session.timeout=1800

################# SPRING Boot Actuator configuration #################
#spring.security.user.name=admin
#spring.security.user.password=admin
#spring.security.user.roles=ADMIN
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*

################# MySql DB configuration #################
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:drivemate}?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:zoomie}
spring.datasource.password=${DB_PASSWORD:zoomie123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
# Minimum number of idle connections that HikariCP tries to maintain
spring.datasource.hikari.minimum-idle=5
# The maximum amount of time that a connection can sit idle in the pool
spring.datasource.hikari.idle-timeout=600000
# The maximum amount of time that the connection pool will wait for a connection to be available before throwing an exception
spring.datasource.hikari.connection-timeout=30000
# The maximum lifetime of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

################# SPRING JPA/DB #################
#spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.naming.physical-strategy=com.sagur.product.common.generic.component.configuration.CustomPhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
# Location for schema initialization scripts
spring.sql.init.schema-locations=classpath:/db/schema.sql
# Location for data initialization scripts
spring.sql.init.data-locations=classpath:/db/data.sql
spring.datasource.hikari.leak-detection-threshold=2000
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
#spring.jpa.properties.hibernate.schema_validation.enabled=true
#spring.jpa.properties.hibernate.envers.autoRegisterListeners=true
spring.jpa.open-in-view=false
hibernate.envers.audit_table_suffix=_AUD
#hibernate.envers.revision_on_collection_change=true
#hibernate.ejb.metamodel.population=compliant

################# logging #################
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.level.org.springframework.beans.factory.support=ERROR
logging.level.org.apache.kafka.clients.consumer=INFO

################# Feign Client Configuration  #################
abc-service-url=http://localhost:8081
auth-service-url=http://zoomie-auth-service:8080
user-service-url=http://zoomie-user-service:8080
copilot-service-url=http://zoomie-booking-service:8080
geo-service-url=http://zoomie-geo-service:8080
feedback-service-url=http://zoomie-feedback-service:8080
pricing-service-url=http://zoomie-pricing-service:8080


########################### Open API Config #####################
openapi.group.name=user
openapi.base.packages=com.sagur.drivemate.user,com.sagur.product.common.web
openapi.contact.name=Sagur IT
openapi.title=Authentication Module
openapi.version=0.0.1
openapi.description=Used for Authentication
openapi.server.description=For Authentication Server

#OpenAPI Configuration
openapi.server.url=${GATEWAY_URI:http://localhost:8080}/api/user
openapi.token.url=${GATEWAY_URI:http://localhost:8080}/api/auth/login

#JWT Config
jwt.sign.
jwt.verify.
jwt.access.token.validity=3600000
jwt.refresh.token.validity=3600000

################# Custom #################
storage.type=local
base.dir=/mnt/data

################# Kafka #################
spring.kafka.bootstrap-servers=booking-kafka-kafka-bootstrap.kafka.svc.cluster.local:9092
spring.kafka.listener.ack-mode=manual

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=5
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.producer.properties.linger.ms=5
spring.kafka.producer.properties.batch.size=32768
spring.kafka.producer.properties.compression.type=lz4
spring.kafka.producer.properties.delivery.timeout.ms=120000

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.max-poll-records=100
spring.kafka.consumer.properties.isolation.level=read_committed
spring.kafka.consumer.properties.fetch.min.bytes=1
spring.kafka.consumer.properties.fetch.max.wait.ms=500
kafka.consumer.group-id.user-registration=user-registration-group
kafka.topic.user-registration-topic=user-registration
kafka.consumer.group-id.booking-status-change=booking-status-change-group
kafka.topic.booking-status-change=booking-status-change

