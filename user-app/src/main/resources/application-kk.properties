################# SERVER #################
server.port=8082
#server.servlet.context-path=/teachr
server.compression.enabled=true
server.tomcat.basedir=./
server.tomcat.accesslog.enabled=true
server.tomcat.accesslog.prefix=access
server.session.timeout=1800

################# SPRING Boot Actuator configuration #################
#spring.security.user.name=admin
#spring.security.user.password=admin
#spring.security.user.roles=ADMIN
management.endpoint.metrics.enabled=true
management.endpoints.web.exposure.include=*

################# MySql DB configuration #################
spring.datasource.url=jdbc:mysql://localhost:3306/drivemate?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=10
# Minimum number of idle connections that HikariCP tries to maintain
spring.datasource.hikari.minimum-idle=5
# The maximum amount of time that a connection can sit idle in the pool
spring.datasource.hikari.idle-timeout=600000
# The maximum amount of time that the connection pool will wait for a connection to be available before throwing an exception
spring.datasource.hikari.connection-timeout=30000
# The maximum lifetime of a connection in the pool
spring.datasource.hikari.max-lifetime=1800000

################# SPRING JPA/DB #################
#spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.jpa.hibernate.naming.physical-strategy=com.sagur.product.generic.component.configuration.CustomPhysicalNamingStrategyStandardImpl
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=none
# Location for schema initialization scripts
spring.sql.init.schema-locations=classpath:/db/schema.sql
# Location for data initialization scripts
spring.sql.init.data-locations=classpath:/db/data.sql
spring.datasource.hikari.leak-detection-threshold=2000
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
#spring.jpa.properties.hibernate.schema_validation.enabled=true
#spring.jpa.properties.hibernate.envers.autoRegisterListeners=true
hibernate.envers.audit_table_suffix=_AUD
#hibernate.envers.revision_on_collection_change=true
#hibernate.ejb.metamodel.population=compliant

################# logging #################
logging.level.org.springframework=INFO
logging.level.com.zaxxer.hikari=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.level.org.springframework.beans.factory.support=ERROR

